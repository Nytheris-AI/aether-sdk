[package]
name = "nytheris-aether-sdk"
description = "Model-free, pieces-first Rust memory SDK unifying record, vector, and graph stores"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nytheris-aether-sdk"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]
live-docker = [
    "nytheris-aether-adapters/sqlite",
    "nytheris-aether-adapters/redis",
    "nytheris-aether-adapters/qdrant",
    "nytheris-aether-adapters/chroma",
    "nytheris-aether-adapters/pgvector",
    "nytheris-aether-adapters/neo4j",
]

[dependencies]
nytheris-aether-core = { path = "../aether-core", version = "0.1.0" }
nytheris-aether-cortex = { path = "../aether-cortex", version = "0.1.0" }
nytheris-aether-adapters = { path = "../aether-adapters", version = "0.1.0" }
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "logs"], optional = true }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.33", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"], optional = true }

[dev-dependencies]
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid.workspace = true

[[example]]
name = "otel_demo"
required-features = ["otel"]
