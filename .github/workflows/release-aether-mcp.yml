name: Release aether-mcp

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Defaults to v<crate version> when omitted."
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="${INPUT_TAG}"
          elif [ "${REF_TYPE:-}" = "tag" ]; then
            TAG="${REF_NAME}"
          else
            TAG="$(python3 -c '
          import pathlib, tomllib
          crate = tomllib.loads(pathlib.Path("crates/aether-vault/Cargo.toml").read_text("utf-8"))
          version = crate["package"]["version"]
          if isinstance(version, dict) and version.get("workspace"):
              root = tomllib.loads(pathlib.Path("Cargo.toml").read_text("utf-8"))
              version = root["workspace"]["package"]["version"]
          print(f"v{version}", end="")
          ')"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '${TAG}' must match vX.Y.Z."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build aether-mcp
        run: cargo build --release -p muninn-aether-vault --bin aether-mcp --target ${{ matrix.target }}

      - name: Package Unix archive and checksum
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist "stage-${TARGET}"
          cp "target/${TARGET}/release/aether-mcp" "stage-${TARGET}/aether-mcp"
          chmod +x "stage-${TARGET}/aether-mcp"
          ARCHIVE="aether-mcp-${RELEASE_TAG}-${TARGET}.tar.gz"
          tar -C "stage-${TARGET}" -czf "dist/${ARCHIVE}" aether-mcp
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
            else
              shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
            fi
          )

      - name: Package Windows archive and checksum
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $target = $env:TARGET
          $archive = "aether-mcp-$tag-$target.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stage = "stage-$target"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$target/release/aether-mcp.exe" "$stage/aether-mcp.exe"
          Compress-Archive -Path "$stage/aether-mcp.exe" -DestinationPath "dist/$archive" -Force
          Push-Location dist
          try {
            $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumPath = Join-Path (Get-Location) "$archive.sha256"
            [System.IO.File]::WriteAllText($checksumPath, "$hash  $archive`n")
          } finally {
            Pop-Location
          }

      - name: Upload target artifact
        uses: actions/upload-artifact@v7
        with:
          name: aether-mcp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      # Checkout first: it cleans the workspace and would delete the downloaded dist/ directory.
      - uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: aether-mcp-*
          path: dist
          merge-multiple: true

      - name: Verify artifact checksums
        run: |
          set -euo pipefail
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "${checksum}"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: aether-mcp ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
            scripts/install.sh
            scripts/install.ps1

  docker:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aether-mcp
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
