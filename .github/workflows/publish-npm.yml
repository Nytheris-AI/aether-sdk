name: Publish npm package

# Publishes @muninn-org/aether-mcp only when the `release` branch is updated, never on a push to
# main. To release, fast-forward `release` to the commit you want published:
#   git push origin <commit>:release
# Pushes that do not change the package version publish nothing.
on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: npm/aether-mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test
        run: npm test

  publish:
    needs: test
    if: github.repository == 'muninn-hq/aether-sdk'
    runs-on: ubuntu-latest
    # Add required reviewers to the `npm` environment in the repository settings for a manual gate.
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm/aether-mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Read package version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip versions that are already published
        id: published
        env:
          SPEC: ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}
        run: |
          if npm view "${SPEC}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${SPEC} is already on npm, nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the aether-mcp release has every build
        if: steps.published.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release.js

      - name: Publish
        if: steps.published.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
