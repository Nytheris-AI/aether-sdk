version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      opentelemetry-minor-patch:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
        update-types:
          - "minor"
          - "patch"
      rust-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      docusaurus-minor-patch:
        patterns:
          - "@docusaurus/*"
        update-types:
          - "minor"
          - "patch"
      types-and-typescript-minor-patch:
        patterns:
          - "@types/*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      website-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@docusaurus/*"
          - "@types/*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
