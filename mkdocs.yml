site_name: Aether SDK
site_url: https://nytheris-ai.github.io/aether-sdk
repo_url: https://github.com/Nytheris-AI/aether-sdk
repo_name: Nytheris-AI/aether-sdk

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/index.md
      - Cortex (Neuro-Symbolic): architecture/cortex.md
      - Protocols: architecture/protocols.md
  - Guides:
      - Usage: guides/usage.md
      - Memory System: guides/memory.md
      - Resources: guides/resources.md
      - Adapters: guides/adapters.md
  - Development:
      - Guidelines: development/guidelines.md
  - About:
      - Roadmap: about/roadmap.md
